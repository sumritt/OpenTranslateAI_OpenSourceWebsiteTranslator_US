<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Widget - Standalone Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    /* Demo Content Styles */
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      padding: 60px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 12px;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .feature-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .feature-card h3 {
      margin-bottom: 10px;
      color: #667eea;
    }
  </style>
</head>
<body>
  <!-- Demo Content -->
  <div class="demo-container" id="translatable-content">
    <div class="hero">
      <h1>开源网站翻译工具</h1>
      <p>基于开源 AI 的完全开源机器翻译解决方案</p>
    </div>

    <div class="features">
      <div class="feature-card">
        <h3>完全开源</h3>
        <p>基于开源翻译引擎，代码透明可审计，无供应商锁定风险。</p>
      </div>
      <div class="feature-card">
        <h3>快速部署</h3>
        <p>支持 Docker 一键部署，也可使用公共实例。集成简单，只需几行代码。</p>
      </div>
      <div class="feature-card">
        <h3>多语言支持</h3>
        <p>支持中文、英文、西班牙语、法语、德语、日语、韩语等多种语言互译。</p>
      </div>
      <div class="feature-card">
        <h3>保留结构</h3>
        <p>智能 DOM 遍历算法，翻译文本同时保留网页结构、样式和交互功能。</p>
      </div>
    </div>
  </div>

  <script
    src="/widget.js"
    data-proxy="http://localhost:54321/functions/v1/translate"
    data-default="zh"
    data-element="translatable-content"></script>
</body>
</html>
